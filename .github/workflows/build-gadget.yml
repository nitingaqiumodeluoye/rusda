name: build-gadget

# 只为「自定义链接器加载」这条线出包：编一个 arm64 的 rusda-gadget，
# 用来验证 frida-core-gadget-custom-linker.patch 是否让 Gadget 能被 CSOLoader
# 这类「不进 soinfo」的加载器拉起。
#
# 为什么单独一个 workflow 而不是塞进 build-android-all.sh：
# 那个脚本编四架构 × (server+gadget+inject)，一次要很久；这里只编 arm64 gadget，
# 迭代快得多。正式发包仍走 build-android-all.sh。
on:
  workflow_dispatch:
    inputs:
      clean:
        description: '忽略缓存，从零构建（缓存疑似损坏时用）'
        type: boolean
        default: false
  push:
    paths:
      - '17.15.0/patches/deliver/frida-core-gadget-custom-linker.patch'
      - '.github/workflows/build-gadget.yml'

env:
  FRIDA_TAG: '17.15.0'
  FRIDA_REPO: 'https://github.com/frida/frida'
  # 缓存版本号：改它可强制作废所有 frida 缓存（补丁/流程大改时用）。
  CACHE_VER: 'v1'
  # frida 的 releng/env_android.py 里有 NDK_REQUIRED = 29，主版本不符会直接
  # 在 configure 阶段报 "NDK r29 is required"。所以这里必须钉死 r29。
  NDK_VERSION: 'r29'
  NDK_ZIP: 'android-ndk-r29-linux.zip'

jobs:
  build-gadget-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rusda (patches)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # frida 的构建链要 Node（生成 JS 侧资源 / 内嵌 agent）。
      # rusda README 记录的编译环境是 Node 22。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # host 依赖也缓存：apt 的 build-essential/ninja/pkg-config 与 pip 的 lief
      # 每次跑都要重新下载安装，属于「每轮固定开销」。
      # 分两段缓存：apt 的 .deb 放在 /var/cache/apt/archives，pip 放在
      # ~/.cache/pip；二者都是纯下载缓存，命中即省网络往返。
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ env.CACHE_VER }}-${{ hashFiles('.github/workflows/build-gadget.yml') }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.CACHE_VER }}-${{ hashFiles('.github/workflows/build-gadget.yml') }}

      - name: Install host deps
        run: |
          sudo apt-get update
          # --no-install-recommends：不装推荐包，减少下载量；
          # apt 会命中上面缓存的 .deb，省掉重复下载。
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config xz-utils git
          # lief 用于 tools/post-process.py 里的二进制改写（topatch）。
          # 不装它，链接后处理会失败。
          pip install --upgrade pip
          pip install lief
          # 确认真的可用（缓存坏掉时尽早暴露）
          python -c 'import lief; print("lief", lief.__version__)'
          ninja --version

      - name: Cache Android NDK ${{ env.NDK_VERSION }}
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk
          # NDK 是 ~700MB 的固定下载，按版本号+OS 做 key，几乎永远命中。
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}-${{ env.CACHE_VER }}

      - name: Download Android NDK ${{ env.NDK_VERSION }}
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ndk"
          cd "$RUNNER_TEMP/ndk"
          echo "下载 $NDK_ZIP ..."
          curl -fL -o ndk.zip "https://dl.google.com/android/repository/$NDK_ZIP"
          unzip -q ndk.zip
          rm -f ndk.zip

      # NDK 解压目录：上面 cache 命中时它已经在 runner.temp/ndk 下了。
      # 注意 NDK 的 cache key 不含 run_number，所以命中时 cache-hit 为 true，
      # 下载步骤会被跳过；这里只需把路径找出来。
      - name: Locate NDK
        id: ndk
        run: |
          set -euo pipefail
          NDK_ROOT="$(find "$RUNNER_TEMP/ndk" -maxdepth 1 -type d -name 'android-ndk-*' | head -1)"
          if [ -z "$NDK_ROOT" ]; then
            echo "缓存与下载都没能提供 NDK（缓存可能损坏），请用 clean 选项重跑"
            ls -la "$RUNNER_TEMP/ndk" || true
            exit 1
          fi
          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "使用 NDK: $NDK_ROOT"
          grep -E 'Pkg\.Revision|Pkg\.Desc' "$NDK_ROOT/source.properties" || true

      # 失败也要把缓存存下来：frida 的全量构建很久，若只在成功时保存，
      # 一旦后面某步失败（比如补丁/编译报错），cloned 源码 + deps/ + 已编译的
      # 那部分 build 目录就全白费，下一轮又从零开始。这里显式 restore/save，
      # 并用 always() 保证失败路径也走到保存。
      # 注意 actions/cache 的 post 步骤是 success() 门控的，所以不能只靠它。
      - name: Restore frida cache
        if: inputs.clean != true
        id: frida-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            frida
            dist-arm64
          key: frida-${{ env.FRIDA_TAG }}-${{ env.CACHE_VER }}-${{ runner.os }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            frida-${{ env.FRIDA_TAG }}-${{ env.CACHE_VER }}-${{ runner.os }}-

      - name: Clone frida ${{ env.FRIDA_TAG }} (cache miss)
        run: |
          set -euo pipefail
          if [ -d frida/.git ]; then
            echo "frida 目录已从缓存恢复，跳过 clone"
            cd frida
            echo "当前基线: $(git describe --tags --always 2>/dev/null || echo unknown)"
            exit 0
          fi
          git clone --recurse-submodules -b "$FRIDA_TAG" "$FRIDA_REPO" frida
          cd frida
          echo "子模块状态:"
          git submodule status | head -20

      # 缓存里那棵树是「上一轮已经打过补丁」的状态，直接再打一次会冲突。
      # 所以先把它还原成官方基线，再干净地打本轮补丁。
      #
      # 注意两点：
      #  - deps/ 与 build-android-*/ 必须保留，否则缓存就白做了。
      #    它们虽然已被 .gitignore 忽略（frida 自带忽略 /deps/，rusda 的
      #    superrepo 补丁追加 /build-android-*/），但那个 .gitignore 改动本身
      #    会被 checkout 还原掉，所以这里显式用 -e 排除，不依赖忽略规则。
      #  - 补丁新增的未跟踪源文件（lib/base/obfuscate.vala、src/topatch.py）必须
      #    删掉，否则再打补丁会报 "already exists"。
      - name: Reset previous patches
        run: |
          set -euo pipefail
          cd frida
          git clean -fd -e deps -e 'build-android-*'
          git checkout -- .
          git submodule foreach --recursive 'git clean -fd && git checkout -- .'
          echo "已还原到官方基线"
          git status --short | head
          ( cd subprojects/frida-core && git status --short | head )

      # 按 patches/deliver/README.txt 的顺序打补丁。
      # 注意 superrepo 要 --exclude=releng（releng 是子模块，单独 pin）。
      - name: Apply patches
        run: |
          set -euo pipefail
          RUSDA="$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/frida"

          echo "=== [1] superrepo.patch ==="
          git apply --exclude=releng "$RUSDA/17.15.0/patches/deliver/superrepo.patch"

          echo "=== [2] frida-core.patch ==="
          ( cd subprojects/frida-core && git apply "$RUSDA/17.15.0/patches/deliver/frida-core.patch" )

          echo "=== [3] frida-core-gadget-custom-linker.patch ==="
          ( cd subprojects/frida-core && git apply "$RUSDA/17.15.0/patches/deliver/frida-core-gadget-custom-linker.patch" )

          echo "=== [4] frida-gum.patch ==="
          ( cd subprojects/frida-gum && git apply "$RUSDA/17.15.0/patches/deliver/frida-gum.patch" )

          echo "=== 确认关键改动确实落到了源码里 ==="
          grep -q "detect_location_from_ranges" subprojects/frida-core/lib/gadget/gadget.vala \
            || { echo "FAIL: gadget.vala 里没有 detect_location_from_ranges，补丁没生效"; exit 1; }
          if grep -q "assert (our_range != null)" subprojects/frida-core/lib/gadget/gadget.vala; then
            echo "FAIL: 断言还在，补丁没替换掉它"; exit 1
          fi
          echo "OK: 断言已移除，回退逻辑已就位"

      # 只编 gadget、只编 arm64：够验证这条线，且比四架构全量快得多。
      # QuickJS 是 frida 默认运行时（frida-gum 的 meson.options 里 quickjs=enabled），
      # 不碰 V8，所以不需要额外的 V8 依赖。
      #
      # build 目录命中缓存时这里必须跳过 configure：frida 的 meson_configure.py
      # 遇到已有 build.ninja 是 sys.exit(1)（"Already configured. Wipe ... to
      # reconfigure."），不是无害的 no-op。跳过它、直接 make，就能拿到 ninja 的
      # 增量构建（meson 自己会在 meson.build 变化时重新生成 build.ninja）。
      - name: Configure (android-arm64, gadget only)
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.NDK_ROOT }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/frida"
          if [ -f build-android-arm64/build.ninja ]; then
            echo "build 目录已从缓存复用，跳过 configure，直接增量构建"
            exit 0
          fi
          mkdir -p build-android-arm64
          cd build-android-arm64
          ../configure \
            --prefix="$GITHUB_WORKSPACE/dist-arm64" \
            --host=android-arm64 \
            --enable-gadget

      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.NDK_ROOT }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/frida/build-android-arm64"
          make -j"$(nproc)"

      - name: Install
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.NDK_ROOT }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/frida/build-android-arm64"
          make install

      # 三条独立校验：
      #  a) 架构必须是 arm64（历史上出现过把 32 位「模拟」gadget 误当 arm64 打包）；
      #  b) 我加的 log_warning 文案必须在二进制里 —— 这是「补丁真的进了产物」的
      #     直接证据，比只看源码能不能打上补丁强；
      #  c) 断言文案不应再出现（它被换掉了）。
      - name: Verify artifact
        id: verify
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/dist-arm64"
          echo "=== dist 树 ==="
          find "$DIST" -name '*gadget*' | head -20

          # 新版 frida 把 gadget 放在 lib/rusda-<api>/{32,64}/，老版在 lib/rusda/{32,64}/
          GADGET="$(find "$DIST/lib" -path '*/64/rusda-gadget.so' 2>/dev/null | head -1)"
          if [ -z "$GADGET" ]; then
            GADGET="$(find "$DIST/lib" -name 'rusda-gadget.so' | head -1)"
          fi
          if [ -z "$GADGET" ]; then
            GADGET="$(find "$DIST" -name '*gadget*.so' | head -1)"
          fi
          test -n "$GADGET" || { echo "FAIL: 没找到 gadget 产物"; find "$DIST" | head -50; exit 1; }
          echo "gadget: $GADGET"

          echo "=== 架构校验 ==="
          readelf -h "$GADGET" | sed -n 's/.*Machine:[[:space:]]*//p'
          readelf -h "$GADGET" | grep -q 'AArch64' \
            || { echo "FAIL: 产物不是 AArch64"; exit 1; }

          echo "=== 补丁痕迹校验 ==="
          if strings -a "$GADGET" | grep -q "custom linker"; then
            echo "OK: 找到补丁注入的告警文案，补丁确实进了产物"
          else
            echo "FAIL: 产物里没有补丁注入的文案 —— 补丁没进二进制"
            exit 1
          fi

          echo "=== 确认不再是官方 gadget（SONAME）==="
          readelf -d "$GADGET" | grep -E 'SONAME' || true

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$GADGET" "$GITHUB_WORKSPACE/out/rusda-gadget-17.15.0-android-arm64.so"
          xz -T0 -c "$GITHUB_WORKSPACE/out/rusda-gadget-17.15.0-android-arm64.so" \
            > "$GITHUB_WORKSPACE/out/rusda-gadget-17.15.0-android-arm64.so.xz"
          ls -lh "$GITHUB_WORKSPACE/out/"
          echo "GADGET_PATH=$GADGET" >> "$GITHUB_OUTPUT"

      - name: Upload gadget
        uses: actions/upload-artifact@v4
        with:
          name: rusda-gadget-17.15.0-arm64-${{ github.run_number }}
          path: |
            out/rusda-gadget-17.15.0-android-arm64.so
            out/rusda-gadget-17.15.0-android-arm64.so.xz
          retention-days: 30

      # 显式保存缓存，跑在 always() 上 —— 失败也要存。
      # 这是本 workflow 能快速迭代的关键：即使这一轮因为补丁写错而在 valac 或
      # 链接阶段失败，frida 源码 + deps/ + 已编译产物也会留下来，下一轮直接从
      # 失败点附近继续，而不是重新 clone + configure + 全量编译。
      # 失败时用 -failed 后缀做 key，避免污染成功路径的缓存；restore-keys 前缀
      # 相同，所以下轮仍能恢复到它。
      # 带 run_attempt 是因为重跑（re-run）会沿用同一个 run_number，而
      # actions/cache/save 遇到已存在的 key 会直接报错，会把成功的构建误判成失败。
      - name: Save frida cache
        if: always() && inputs.clean != true
        uses: actions/cache/save@v4
        with:
          path: |
            frida
            dist-arm64
          key: frida-${{ env.FRIDA_TAG }}-${{ env.CACHE_VER }}-${{ runner.os }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ job.status }}

      # 构建失败时把 meson 日志捞出来，省一次往返。
      - name: Collect logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            frida/build-android-arm64/meson-logs/
            frida/build-android-*/meson-logs/
          if-no-files-found: ignore
          retention-days: 7
